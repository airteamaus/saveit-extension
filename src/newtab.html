<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newtab Bookmarks</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preload" href="fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared-ui.css">
  <link rel="stylesheet" href="newtab.css">
</head>
  <body>
  <main id="saved-pages-page" class="desk-page" aria-label="Saved pages">
    <div class="desk-utility-row">
      <div class="desk-utility-left">
        <button
          id="saved-pages-sidebar-toggle-btn"
          class="projects-menu-trigger"
          type="button"
          aria-label="Toggle projects menu"
          aria-expanded="false"
          aria-controls="project-sidebar"
          title="Toggle projects menu"
        >
          Projects
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <button id="desk-data-sync-link" class="desk-utility-link" type="button">Data &amp; sync</button>
      </div>
      <div class="desk-utility-right">
        <button id="hero-sign-in-btn" class="sign-in-btn hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign in
        </button>
        <div id="hero-user-menu" class="user-menu hidden">
          <button id="hero-user-avatar-btn" class="user-avatar-btn" title="Account">
            <span id="hero-user-avatar" class="user-avatar"></span>
          </button>
          <div id="hero-user-dropdown" class="user-dropdown hidden" data-dropdown-mode="class">
              <div id="hero-theme-toggle-container"></div>
              <button id="hero-refresh-btn" class="dropdown-item" type="button" title="Clear the local cache and reload everything from the server">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Refresh cache
              </button>
              <button id="hero-sharing-btn" class="dropdown-item" type="button" title="Review who can see each of your projects">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="18" cy="5" r="3"></circle>
                  <circle cx="6" cy="12" r="3"></circle>
                  <circle cx="18" cy="19" r="3"></circle>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                Sharing
              </button>
              <div class="user-info">
                <span id="hero-user-email" class="user-email"></span>
              </div>
                <button id="hero-sign-out-btn" class="dropdown-item dropdown-item-danger">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                  Sign out
              </button>
          </div>
        </div>
      </div>
    </div>

    <header class="desk-masthead">
      <a href="newtab.html" class="desk-masthead-wordmark">Newtab</a>
      <p id="desk-dateline" class="desk-dateline"></p>
      <div class="desk-rule-double" aria-hidden="true"></div>
    </header>

    <form id="saved-pages-search-form" class="search-form desk-search-hero" role="search">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </span>
      <input
        type="text"
        id="saved-pages-search-input"
        class="search-input desk-search-input"
        placeholder="Search your desk…"
        autocomplete="off"
        autofocus
      >
      <button id="saved-pages-search-clear-btn" class="clear-search hidden" type="button" title="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <button id="desk-search-find-btn" class="desk-search-find" type="submit">Find</button>
    </form>

    <div id="desk-launch-strip" class="launch-strip" aria-label="Pinned pages"></div>

    <nav id="project-pills" class="project-pills" aria-label="Projects"></nav>

    <section class="desk-index">
      <div id="desk-index-header" class="desk-index-header">
        <h2 id="desk-index-title" class="desk-index-title">Recently saved</h2>
        <span id="feed-scope-kicker-slot"></span>
        <label class="desk-sort-label">
          <span class="desk-sort-label-text">Sort</span>
          <select id="desk-sort" class="desk-sort">
            <option value="newest" selected>Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </label>
      </div>
      <div id="feed-disclosure-slot"></div>
      <div id="saved-pages-results" class="desk-index-results" aria-live="polite"></div>
    </section>

    <div id="saved-pages-sidebar-backdrop" class="projects-menu-backdrop hidden" aria-hidden="true"></div>
    <aside id="project-sidebar" class="projects-menu-panel" aria-label="Projects"></aside>
  </main>

  <footer class="minimal-footer">
    <a href="https://getsave.it/privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
    <span id="hero-version-indicator">v<span id="hero-version-number">...</span></span>
  </footer>

  <div id="project-editor-backdrop" class="project-editor-backdrop hidden" aria-hidden="true"></div>
  <div
    id="project-editor-dialog"
    class="project-editor-dialog hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="project-editor-title"
  ></div>

  <div id="sharing-centre-backdrop" class="project-editor-backdrop hidden" aria-hidden="true"></div>
  <div
    id="sharing-centre-dialog"
    class="project-editor-dialog sharing-centre-dialog hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sharing-centre-title"
  ></div>

  <div id="data-sync-centre-backdrop" class="project-editor-backdrop hidden" aria-hidden="true"></div>
  <div
    id="data-sync-centre-dialog"
    class="project-editor-dialog data-sync-dialog hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="data-sync-centre-title"
  ></div>

  <!-- Toast notifications (e.g. mirror-toggle confirmations). Auto-dismiss. -->
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <!-- Minimal script dependencies -->
  <script src="polyfill-loader.js"></script>
  <script type="module" src="config-loader.js"></script>
  <script type="module" src="bundles/sentry-init.js"></script>
  <script src="mock-data.js"></script>
  <script src="auth-menu.js"></script>
  <script src="theme-manager.js"></script>
  <script type="module" src="newtab.js"></script>
</body>
</html>
